    const song=document.getElementById("song"); //lấy thẻ song để phát nhạc
    const jp=document.querySelector(".Japanese"); //lấy thẻ Japanese để hiện tiếng Nhật
    const ro=document.querySelector(".Romaji"); //lấy thẻ Romaji để hiện phiên âm
    const vi=document.querySelector(".Vietnamese"); //lấy thẻ Vietnamese để hiện tiếng Việt
   
    song.addEventListener("timeupdate",()=>{ //hàm timeupdate là sự kiện chạy liên tục khi audio đang phát, đơn giản là hàm cập nhật thời gian
    const currentTime= song.currentTime;
    let currentLyrics= null; //Chưa có lời phù hợp 
    for(let i=0; i<lyrics.length; i++){
        if(currentTime>=lyrics[i].time)
        {
            currentLyrics=lyrics[i]; //Nếu currentTime lớn hơn hoặc bằng thời gian lyrics[i].time, tức là bài nhạc đã đến hoặc vượt qua câu đó ⇒ gán currentLyrics là câu đó.
        }
        else
        {
        break; //Nếu currentTime nhỏ hơn ⇒ dừng vòng lặp (break)
        }
    }
    
    if(currentLyrics) //Nếu đã tìm thấy câu phù hợp (currentLyrics khác null)
    {
    jp.textContent=currentLyrics.J;
    ro.textContent=currentLyrics.R;
    vi.textContent=currentLyrics.V;
    }
    else //Nếu chưa tới thời gian câu đầu tiên (vd: bài mới bắt đầu) ⇒ xóa nội dung
