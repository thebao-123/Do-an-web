<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">

        <style>
            body{
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: antiquewhite;
    color:black;
    overflow: hidden;/*nếu nội dung bị tràn ra ngòa thì dùng overflow: hidden; để ẩn đi*/
}
.play-music{
    width: 100%;
    position: relative;
}
.background {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.background-image {
  display: block;
  margin: 0 auto;     
  max-width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: cover;
}

.audio{
    position:relative;
    text-align: center;
    width: 100%;
    margin-top: 20px;
}
.lyrics{
    position: relative;
    text-align: center;
    margin-top: 20px;
    width: 100%;
    line-height: 1.6;
}
.Japanese{
    font-size: 24px;
    font-weight: bold;
}
.Romaji{
    font-size: 24px;
}
.Vietnamese{
    font-size: 24px;
}


        </style>
    </head>

            <!--Ảnh background-->

            </div>

            <!--Nhạc-->

            </div>
            
        </div>
    </body>

    {time: 142.54, J:"どんな感情も 半分にしていたい", R:"Donna kanjou mo hanbun ni shite itai", V:"Toàn bộ những cảm xúc, mỗi người vun vén nửa phần"},
    {time: 148.79, J:"君が思う なんでもないことも", R:"Kimi ga omou nandemonai koto mo", V:"Dù là những điều anh cho là bình thường nhất"},
    {time: 154.49, J:"なんだって わたしは特別に思うから", R:"Nandatte watashi wa tokubetsu ni omou kara", V:"Thì đối với em, hết thảy đều thật đặc biệt"},

    {time: 161.49, J:"なんでもない を束ねてたら", R:"Nandemonai wo tabanetetara", V:"Nếu ta gom góp tất cả 'những điều bình thường ấy' "},

 {time: 185, J:"",R:"",V:""},

    {time: 230.60, J:"By my side 君といたい", R:"By my side kimi to itai", V:"Ở bên em nhé, em muốn ở bên anh mãi mãi"},
    {time: 236.49, J:"ただの日常を 一生を祝っていこう", R:"Tada no nichijou wo isshou wo iwatte ikou", V:"Cùng nhau kỷ niệm từng khoảnh khắc bình dị suốt đời"},
    {time: 242.40, J:"君がすきな花 わたしも持ってて", R:"Kimi ga suki na hana watashi mo mottete", V:"Em đang cầm trên tay bông hoa mà anh yêu"},
    {time: 248.15, J:"あぁ、もう笑っちゃうね", R:"Aa, mou waracchau ne", V:"A, thật sự chẳng thể ngừng cười mà"},
     {time: 257, J:"",R:"",V:""},
 ];
    
    const song=document.getElementById("song"); //lấy thẻ song để phát nhạc
    const jp=document.querySelector(".Japanese"); //lấy thẻ Japanese để hiện tiếng Nhật
    const ro=document.querySelector(".Romaji"); //lấy thẻ Romaji để hiện phiên âm
    const vi=document.querySelector(".Vietnamese"); //lấy thẻ Vietnamese để hiện tiếng Việt
   
    song.addEventListener("timeupdate",()=>{ //hàm timeupdate là sự kiện chạy liên tục khi audio đang phát, đơn giản là hàm cập nhật thời gian
    const currentTime= song.currentTime;
    let currentLyrics= null; //Chưa có lời phù hợp 
    for(let i=0; i<lyrics.length; i++){
        if(currentTime>=lyrics[i].time)
        {
            currentLyrics=lyrics[i]; //Nếu currentTime lớn hơn hoặc bằng thời gian lyrics[i].time, tức là bài nhạc đã đến hoặc vượt qua câu đó ⇒ gán currentLyrics là câu đó.
        }
        else
        {
        break; //Nếu currentTime nhỏ hơn ⇒ dừng vòng lặp (break)
        }
    }
    
    if(currentLyrics) //Nếu đã tìm thấy câu phù hợp (currentLyrics khác null)
    {
    jp.textContent=currentLyrics.J;
    ro.textContent=currentLyrics.R;
    vi.textContent=currentLyrics.V;
    }
    else //Nếu chưa tới thời gian câu đầu tiên (vd: bài mới bắt đầu) ⇒ xóa nội dung
    {
    jp.textContent="";
    ro.textContent="";
    vi.textContent="";
    }
 }
